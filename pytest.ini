# This repository's own tests; bin/test puts tools/ on PYTHONPATH.
#
# The suites are unittest's, so only unittest.TestCase classes are collected:
# empty python_classes and python_functions keep a helper named test_* or Test*
# from being taken for a test. worksteal hands out single tests and has an idle
# worker take queued ones from a busy one, so no order or grouping is kept
# anywhere. test/ is on the path for the helpers the suites import by bare name.
#
# --strict-config, --strict-markers, filterwarnings = error and xfail_strict
# each turn a mistake pytest would otherwise only warn about, or pass, into a
# failure: a misspelt option or marker, a warning, and an xfail that passes.
[pytest]
addopts = -n auto --dist worksteal --strict-config --strict-markers
filterwarnings = error
minversion = 8.3
python_classes =
python_files = test_*.py
python_functions =
pythonpath = test
required_plugins = pytest-subtests pytest-xdist
testpaths = test
xfail_strict = true
