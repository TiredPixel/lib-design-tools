concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.ref }}
jobs:
  build:
    # Tests only: a consumer builds the dev image from its own submodule, so
    # the one thing pushed is that image, as the layer cache the next run
    # builds from.
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      # No app token: the submodules are public, cloned over HTTPS with no
      # credential.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: docker/login-action@v4
        with:
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ghcr.io
          username: ${{ github.actor }}
      # build-dev-latest builds dev from the branch's and latest's cached
      # images and pushes the branch's; the Compose build then reuses those
      # layers on the same daemon.
      - name: Build dev
        run: |
          lib/shell-common/docker/build-dev-latest
          make build
      # Not a Lint step as well: bin/test runs the lint passes first, so a
      # second one would repeat them in a second container.
      - name: Test
        run: |
          make test
    # Bounded because GitHub's default runs to hours. Generous, as the first
    # run on a branch with no cached image yet builds from cold.
    timeout-minutes: 15
name: Build
on:
  pull_request:
    branches:
      - latest
  push:
    branches:
      - latest
    tags:
      - '[0-9]+.[0-9]+'
