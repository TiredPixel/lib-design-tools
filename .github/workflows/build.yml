concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.ref }}
# Strict as the repository's scripts are: GitHub's default bash for run steps
# lacks pipefail, -u, inherit_errexit and failglob.
defaults:
  run:
    shell: bash -Eeuo pipefail -O inherit_errexit -O failglob {0}
jobs:
  build:
    # Packages read only: a pull request runs its branch's Makefile and
    # lib/shell-common, which whoever opens it can change; cache, run on a
    # person's push, writes.
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-latest
    steps:
      # No app token: the submodules are public, cloned over HTTPS with no
      # credential.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: docker/login-action@v4
        with:
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ghcr.io
          username: ${{ github.actor }}
      # Takes its layers from latest.dev, which cache pushes, for make build to
      # reuse on the same daemon.
      - name: Build dev
        run: |
          lib/shell-common/docker/build-dev-latest-nopush
          make build
      # Not a Lint step as well: bin/test runs the lint passes first, so a
      # second one would repeat them in a second container.
      - name: Test
        run: |
          make test
    # Bounded because GitHub's default runs to hours. Generous, as a run with
    # no cached image yet builds from cold.
    timeout-minutes: 15
  # Pushes the dev image as the layer cache build takes, which nothing deploys.
  # Only on a person's push, never an app's, whose tree would otherwise run here
  # with this write.
  cache:
    if: github.event_name == 'push' && github.event.sender.type == 'User'
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: docker/login-action@v4
        with:
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ghcr.io
          username: ${{ github.actor }}
      - name: Push dev
        run: |
          lib/shell-common/docker/build-dev-latest
    # Bounded as build is, whose limit covers this same image build and the
    # suite besides.
    timeout-minutes: 15
name: Build
on:
  pull_request:
    branches:
      - latest
  push:
    branches:
      - latest
    tags:
      - '[0-9]+.[0-9]+'
