---
# TRACK USES actions/create-github-app-token@v3
# TRACK USES TiredPixel/lib-shell-common@latest
# One run at a time for each pull request, none cancelled: GitHub keeps a single
# run pending in the group, the latest, and each run reads the pull request's
# state afresh, so the last one posts the current state, however many comments
# Codex's edits queue. The gate's run again for another pull request after a
# close or a push runs in the first one's group, so beside the other's own runs,
# a gap the gate's header names.
concurrency:
  cancel-in-progress: false
  group: review-${{ github.event.number || github.event.issue.number }}
jobs:
  review:
    # A comment on a plain issue has no checks to post, and the gate, unable to
    # read issues, fails on a number naming no pull request.
    if: github.event.pull_request || github.event.issue.pull_request
    # None for the workflow's own token, since nothing reads the repository's
    # files; the checks are written with the review app's token, since GitHub
    # counts a check run towards a required check only from the app the rule
    # names.
    permissions: {}
    runs-on: ubuntu-latest
    steps:
      # Minted here, in the workflow only a person may change, by an action
      # pinned by full SHA, so the key never leaves the workflow.
      - id: token
        # The action's name and a full commit SHA leave no way to break the
        # line.
        # yamllint disable-line rule:line-length
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        with:
          client-id: ${{ vars.REVIEW_APP_CLIENT_ID }}
          permission-checks: write
          permission-pull-requests: read
          private-key: ${{ secrets.REVIEW_APP_PRIVATE_KEY }}
      # The gate's own steps and code, pinned by full SHA rather than run from
      # the submodule, whose pin an ordinary commit can move: whatever runs
      # here holds the token, which can write the checks the gate exists to
      # protect, so a change to it reaches the repository only through a
      # workflow approval, and each move of the pin needs one.
      - name: Post review checks
        # The action's name and a full commit SHA leave no way to break the
        # line.
        # yamllint disable-line rule:line-length
        uses: TiredPixel/lib-shell-common/github/review@c6b48977917e61ee8afa3b42e476ceba69286707
        with:
          app: ${{ steps.token.outputs.app-slug }}
          checks: ${{ vars.REVIEW_GATE_CHECKS }}
          token: ${{ steps.token.outputs.token }}
    # The gate's own run, which takes seconds, bounded so a hung one stops well
    # before GitHub's default timeout; a Codex review takes as long as it takes,
    # the check waiting meanwhile.
    timeout-minutes: 5
name: Review
"on":
  issue_comment:
    types:
      - created
      - deleted
      - edited
  pull_request_target:
    types:
      # Closing a pull request lets another open on the same head commit, whose
      # checks it shared, pass.
      - closed
      # A change of base raises edited, and a review of the diff against the old
      # base no longer counts.
      - edited
      - opened
      - ready_for_review
      - reopened
      # A push leaves any other pull request on the old head free to pass.
      - synchronize
