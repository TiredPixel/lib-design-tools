# The preview, for a consumer with pages to include beside compose.gate.yml,
# also with project_directory: . -- bin/preview on the tree as it is on disk,
# read-only, so an edit shows on reload. An init process forwards the stop
# signal, which Python running as pid 1 would ignore. The host port is free
# unless DC_PREVIEW_PORT pins one.
services:
  preview:
    build:
      context: .
      target: dev
    command:
      - preview
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - import urllib.request; urllib.request.urlopen("http://localhost:8080/")
    init: true
    ports:
      - ${DC_PREVIEW_PORT:-0}:8080
    volumes:
      - read_only: true
        source: .
        target: /home/x/r
        type: bind
