<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <title>Example palette</title>
    <link rel="stylesheet" href="../src/palette.css" />
    <link rel="stylesheet" href="preview.css" />
  </head>
  <body>
    <h1>Palette</h1>
    <ul id="swatches"></ul>
    <script>
      const swatches = document.getElementById("swatches");

      function leaves(value, path) {
        if (typeof value === "string") {
          return /^#[0-9a-f]{3,8}$/i.test(value)
            ? [[path.join("-"), value]]
            : [];
        }
        return Object.entries(value).flatMap(([key, child]) =>
          leaves(child, [
            ...path,
            Array.isArray(value) ? Number(key) + 1 : key,
          ]),
        );
      }

      function add(className, text) {
        const item = document.createElement("li");
        item.className = className;
        item.textContent = text;
        swatches.append(item);
        return item;
      }

      fetch("../src/palette.json")
        .then((response) => {
          if (!response.ok) {
            throw new Error(`palette.json: ${response.status}`);
          }
          return response.json();
        })
        .then((palette) => {
          for (const [name, colour] of leaves(palette, [])) {
            add("swatch", `${name} ${colour}`).style.backgroundColor = colour;
          }
        })
        .catch((error) => {
          add("load-error", String(error));
          console.error(error);
        });
    </script>
  </body>
</html>
