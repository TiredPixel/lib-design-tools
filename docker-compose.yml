---
services:
  preview:
    build: &preview_build
      args:
        USER_GID: ${DC_GID:-1000}
        USER_UID: ${DC_UID:-1000}
      context: .
      target: test
    command:
      - preview
    init: true
    ports:
      - ${DC_PREVIEW_HOST:-127.0.0.1}:${DC_PREVIEW_PORT:-0}:8080
    profiles:
      - preview
    volumes:
      - bind:
          create_host_path: false
        read_only: true
        source: ./src
        target: /home/x/r/src
        type: bind
      - bind:
          create_host_path: false
        read_only: true
        source: ./preview
        target: /home/x/r/preview
        type: bind
  # make format binds the tree's own paths over the copy at run time.
  tooling:
    build: *preview_build
    init: true
    network_mode: none
    profiles:
      - test
    user: ${DC_BIND_USER:-}
  # No mount, so what a run checks cannot change under it.
  tooling_test:
    build: *preview_build
    environment:
      PYTEST_XDIST_AUTO_NUM_WORKERS: ${PYTEST_XDIST_AUTO_NUM_WORKERS:-}
    init: true
    network_mode: none
    profiles:
      - test
  # A network, since a project's version mover fetches its releases.
  tooling_upgrade:
    build: *preview_build
    init: true
    profiles:
      - test
    user: ${DC_BIND_USER:-}
