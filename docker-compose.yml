# The services, which this repository uses itself and another repository links
# as its own docker-compose.yml. Compose resolves paths against the folder
# holding the link, so every path here is that repository's: its tree, and its
# Dockerfile, a link to this one's.
---
services:
  # Runs bin/format and bin/coverage, whose writes have to reach the host tree,
  # which only this mount carries there. The whole tree is bound rather than
  # file by file, since a single-file bind pins an inode and goes stale when an
  # editor saves by rename.
  design:
    build:
      context: .
      target: dev
    init: true
    network_mode: none
    profiles:
      - test
    user: ${DC_BIND_USER:-}
    volumes:
      - .:/home/x/r
  # Runs bin/lint and bin/test on the tree the test stage copied: no mount, so
  # what a run checks cannot change under it, and no network, so nothing a page
  # loads can come from outside the tree. init, as PID 1, reaps the Chromium
  # processes a timeout's kill orphans, and passes make test's signals on, where
  # bin/test as PID 1 would ignore a TERM or INT it sets no trap for.
  design_test:
    build:
      context: .
      target: test
    environment:
      - PYTEST_XDIST_AUTO_NUM_WORKERS
    init: true
    network_mode: none
    profiles:
      - test
  # bin/preview on the tree as it is on disk, read-only, so an edit shows on
  # reload. Under a profile of its own, which make preview selects, so a bare
  # docker compose up starts nothing a repository has not asked for. An init
  # process forwards the stop signal, which Python running as PID 1 would
  # ignore. README.md, Previewing pages, gives the host port and address.
  preview:
    build:
      context: .
      target: dev
    command:
      - preview
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - import urllib.request as r; r.urlopen("http://localhost:8080/")
    init: true
    ports:
      - ${DC_PREVIEW_HOST:-127.0.0.1}:${DC_PREVIEW_PORT:-0}:8080
    profiles:
      - preview
    volumes:
      - read_only: true
        source: .
        target: /home/x/r
        type: bind
