[lint]
# Beyond ruff's defaults: E501, since the formatter leaves comments and
# docstrings to run past the line length; PERF and PT, ruff's performance and
# pytest rules; RUF100, so an unused suppression fails; D205 and D209, so a
# docstring keeps PEP 257's summary line.
extend-select = ["E501", "PERF", "PT", "RUF100", "D205", "D209"]
# PT009 and PT027, since the suites are unittest.TestCase classes, which keep
# unittest's assertions.
ignore = ["PT009", "PT027"]
